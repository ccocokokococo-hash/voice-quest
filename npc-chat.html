  <meta charset="UTF-8" />

<div class="game-layout">

    <a href="missions.html">🎯 Missions</a>

  <main>
    <div class="top-card">
      <h1>💬 NPC Chat</h1>
      <p>The Teacher Wizard asks small questions to keep students inside the lesson.</p>
    </div>

    <div class="chat-box">
      <div class="npc-message" id="npcQuestion"></div>

      <input id="npcInput" placeholder="Type your answer in English..." />

      <button onclick="sendNPC()">Send Answer</button>
      <button class="secondary" onclick="newQuestion()">New Question</button>

      <div id="npcReply"></div>
    </div>
  </main>
